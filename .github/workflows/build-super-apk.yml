name: Test, Build & Release Parent Super Guard v5.4 APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Safety & Dialog Unit Tests + Build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Rename APK for clarity
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ParentSuperGuard-v5.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParentSuperGuard-v5.4-APK
          path: app/build/outputs/apk/debug/ParentSuperGuard-v5.4.apk

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/ParentSuperGuard-v5.4.apk
